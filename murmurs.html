<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Tianze J. 的碎碎念与随手记录">
  <title>碎碎念 | Tianze J.</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f5f1eb;
      --ink: #29231f;
      --muted: #70675f;
      --line: rgba(41, 35, 31, 0.16);
      --accent: #a53f32;
      --sage: #6d8178;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 84% 8%, rgba(154, 181, 171, 0.26), transparent 28%),
        var(--paper);
      color: var(--ink);
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    a {
      color: inherit;
    }

    .shell {
      width: min(1080px, calc(100% - 12vw));
      margin: 0 auto;
    }

    .site-header {
      min-height: 88px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      border-bottom: 1px solid var(--line);
    }

    .brand {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 22px;
      font-style: italic;
      text-decoration: none;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      color: var(--muted);
      font-size: 14px;
      text-decoration: none;
      transition: color 180ms ease;
    }

    .back-link:hover,
    .back-link:focus-visible {
      color: var(--accent);
      outline: none;
    }

    .back-link span {
      font-size: 20px;
      line-height: 1;
    }

    .hero {
      padding: clamp(72px, 11vw, 142px) 0 clamp(58px, 9vw, 102px);
    }

    .eyebrow {
      margin: 0 0 24px;
      color: var(--accent);
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(64px, 12vw, 148px);
      font-style: italic;
      font-weight: 400;
      line-height: 0.96;
      letter-spacing: 0;
    }

    .hero-bottom {
      margin-top: clamp(42px, 7vw, 76px);
      padding-top: 22px;
      display: flex;
      justify-content: space-between;
      gap: 28px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
    }

    .hero-note {
      max-width: 510px;
      margin: 0;
    }

    .entry-list {
      border-top: 1px solid var(--line);
    }

    .entry {
      display: grid;
      grid-template-columns: minmax(150px, 220px) minmax(0, 1fr);
      gap: clamp(32px, 8vw, 112px);
      padding: clamp(42px, 7vw, 78px) 0;
      border-bottom: 1px solid var(--line);
    }

    .entry-meta {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .entry-number {
      color: var(--sage);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 17px;
      font-style: italic;
    }

    .entry-date {
      color: var(--muted);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 18px;
      font-style: italic;
    }

    .entry h2 {
      margin: 0 0 22px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(34px, 5vw, 58px);
      font-style: italic;
      font-weight: 400;
      line-height: 1.12;
    }

    .entry p {
      max-width: 680px;
      margin: 0;
      color: #514a44;
      font-size: clamp(17px, 2vw, 19px);
      line-height: 1.95;
    }

    .entry-minimal {
      align-items: center;
    }

    .entry-minimal h2 {
      margin-bottom: 0;
    }

    .site-footer {
      min-height: 136px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      color: var(--muted);
      font-size: 14px;
    }

    .visitor-count span {
      margin-left: 6px;
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 18px;
      font-style: italic;
    }

    .footer-home {
      color: var(--ink);
      text-decoration: none;
    }

    .footer-home:hover,
    .footer-home:focus-visible {
      color: var(--accent);
      outline: none;
    }

    @media (max-width: 680px) {
      .shell {
        width: min(100% - 36px, 1080px);
      }

      .site-header {
        min-height: 72px;
      }

      .hero {
        padding-top: 58px;
      }

      h1 {
        font-size: clamp(58px, 20vw, 92px);
      }

      .hero-bottom {
        align-items: flex-start;
        flex-direction: column;
      }

      .entry {
        grid-template-columns: 1fr;
        gap: 24px;
      }

      .entry-meta {
        flex-direction: row;
        justify-content: space-between;
      }

      .site-footer {
        align-items: flex-start;
        flex-direction: column;
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <header class="site-header shell">
    <a class="brand" href="index.html">Tianze J.</a>
    <a class="back-link" href="index.html"><span aria-hidden="true">←</span> 返回首页</a>
  </header>

  <main>
    <section class="hero shell">
      <p class="eyebrow">Personal Notes / 随手记录</p>
      <h1>碎碎念</h1>
      <div class="hero-bottom">
        <p class="hero-note">一些路过脑海的想法、停顿和瞬间。没有固定主题，也不急着得出结论。</p>
        <span>02 Entries · Since 2026</span>
      </div>
    </section>

    <section class="entry-list shell" aria-label="碎碎念时间线">
      <article class="entry">
        <div class="entry-meta">
          <span class="entry-number">Note / 02</span>
          <time class="entry-date" datetime="2026-06-28">2026.06.28</time>
        </div>
        <div>
          <h2>关于慢一点</h2>
          <p>有时候不是没有在前进，只是速度变得更安静。把事情写下来以后，模糊的念头像被摊开，反而能看见下一步应该往哪里走。</p>
        </div>
      </article>

      <article class="entry entry-minimal">
        <div class="entry-meta">
          <span class="entry-number">Note / 01</span>
          <time class="entry-date" datetime="2026-06-12">2026.06.12</time>
        </div>
        <div>
          <h2>Thinking of You</h2>
        </div>
      </article>
    </section>
  </main>

  <footer class="site-footer shell">
    <div class="visitor-count">访问数：<span id="busuanzi_value_page_pv">--</span></div>
    <a class="footer-home" href="index.html">返回 Tianze J. 首页 ↑</a>
  </footer>

  <script defer src="https://events.vercount.one/js"></script>
  <script>
    (() => {
      const element = document.getElementById("busuanzi_value_page_pv");
      const base = 35;
      const anchor = 3;
      let attempts = 0;
      const timer = window.setInterval(() => {
        attempts += 1;
        const raw = Number(element.textContent);
        if (Number.isFinite(raw) && element.textContent !== "--") {
          element.textContent = String(Math.max(base, base + raw - anchor));
          window.clearInterval(timer);
        } else if (attempts >= 150) {
          window.clearInterval(timer);
        }
      }, 100);
    })();
  </script>

</body>
</html>
